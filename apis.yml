name: Agito Networks
description: >-
  Agito Networks was an enterprise mobility and mobile unified communications
  (UC) company headquartered in Santa Clara, California, with a European
  presence in Reading, England. Its flagship product, the RoamAnywhere Mobility
  Router, was a network appliance that fused enterprise wireless LANs, carrier
  cellular networks, IP telephony, and location technology to extend PBX,
  deskphone, and unified communications features to mobile phones, providing
  handover between WiFi, 3G, and cellular networks while remaining agnostic to
  carrier and equipment vendor. The company was venture-backed by Battery
  Ventures, Castile Ventures, and ITX International. Agito Networks was acquired
  by IP telephony provider ShoreTel in 2010 for approximately $11.4 million,
  adding fixed-mobile convergence to ShoreTel's UC portfolio; ShoreTel was later
  acquired by Mitel, and the agitonetworks.com domain now redirects to Mitel.
  The company no longer operates as a standalone entity and publishes no public
  API, developer portal, or specifications.
